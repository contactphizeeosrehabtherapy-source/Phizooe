<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>We'll Be Back Soon | PhiZeeo</title>
  <meta name="description" content="PhiZeeo is currently undergoing scheduled maintenance to serve you better. We'll be back online very soon!" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph -->
  <meta property="og:title" content="Under Maintenance | PhiZeeo" />
  <meta property="og:description" content="We're making things better for you. Back soon!" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.phizeeo.com" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary:    #2DD4BF;
      --primary-dk: #0D9488;
      --accent:     #818CF8;
      --accent-dk:  #6366F1;
      --bg:         #060B17;
      --bg2:        #0D1426;
      --glass:      rgba(255,255,255,0.04);
      --glass-bd:   rgba(255,255,255,0.08);
      --text:       #E2E8F0;
      --muted:      #64748B;
      --white:      #FFFFFF;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    #canvas-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
      animation: blobFloat 12s ease-in-out infinite alternate;
    }
    .blob-1 { width: 640px; height: 640px; background: var(--primary); top: -200px; left: -200px; animation-duration: 14s; }
    .blob-2 { width: 500px; height: 500px; background: var(--accent); bottom: -150px; right: -150px; animation-duration: 18s; animation-delay: -6s; }
    .blob-3 { width: 300px; height: 300px; background: #F472B6; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-duration: 20s; animation-delay: -10s; opacity: 0.10; }

    @keyframes blobFloat {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,60px) scale(1.12); }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      gap: 1.75rem;
    }

    .logo-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      animation: fadeDown 0.8s ease both;
    }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 12px;
      display: grid;
      place-items: center;
      box-shadow: 0 0 24px rgba(45,212,191,0.4);
    }
    .logo-icon svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .logo-name {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .gear-wrap {
      position: relative;
      width: 110px; height: 110px;
      animation: fadeUp 0.9s ease 0.1s both;
    }
    .gear-outer-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid var(--glass-bd);
    }
    .gear-spin-a { position: absolute; inset: 0; animation: spinSlow 9s linear infinite; }
    .gear-spin-b { position: absolute; inset: 20px; animation: spinSlow 7s linear infinite reverse; }
    .gear-spin-a svg, .gear-spin-b svg { width: 100%; height: 100%; }
    .gear-dot {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 22px; height: 22px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(45,212,191,0.7);
    }
    @keyframes spinSlow { to { transform: rotate(360deg); } }

    .hero-title {
      font-size: clamp(1.75rem, 5vw, 3rem);
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      letter-spacing: -0.5px;
      animation: fadeUp 0.9s ease 0.2s both;
    }
    .hero-title .highlight {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-subtitle {
      font-size: 0.97rem;
      color: var(--muted);
      text-align: center;
      max-width: 400px;
      line-height: 1.65;
      animation: fadeUp 0.9s ease 0.3s both;
    }
    .hero-subtitle em { color: var(--text); font-style: italic; font-family: 'Caveat', cursive; font-size: 1.1rem; }

    .countdown { display: flex; gap: 1rem; animation: fadeUp 0.9s ease 0.4s both; }
    .cd-unit { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
    .cd-box {
      background: var(--glass);
      border: 1px solid var(--glass-bd);
      border-radius: 14px;
      width: 70px; height: 70px;
      display: grid; place-items: center;
      font-size: 1.9rem; font-weight: 800; color: var(--white);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      position: relative; overflow: hidden;
      transition: border-color 0.3s;
    }
    .cd-box::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(45,212,191,0.07) 0%, transparent 100%);
    }
    .cd-box:hover { border-color: rgba(45,212,191,0.45); }
    .cd-label { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .cd-colon { font-size: 1.8rem; font-weight: 800; color: var(--muted); align-self: center; margin-top: -1rem; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0.15; } }

    .progress-section { width: 100%; max-width: 390px; animation: fadeUp 0.9s ease 0.5s both; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; font-weight: 600; letter-spacing: 0.06em; }
    .progress-track { height: 6px; background: var(--glass-bd); border-radius: 99px; overflow: hidden; }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 99px;
      animation: fillBar 2.5s ease 1s forwards;
      box-shadow: 0 0 10px rgba(45,212,191,0.5);
    }
    @keyframes fillBar { to { width: 72%; } }
    .progress-dots { display: flex; gap: 0.4rem; margin-top: 0.7rem; justify-content: center; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--glass-bd); }
    .dot.active { background: var(--primary); }
    .dot.done   { background: var(--accent); }

    .status-row { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; animation: fadeUp 0.9s ease 0.6s both; }
    .status-card {
      background: var(--glass);
      border: 1px solid var(--glass-bd);
      border-radius: 12px;
      padding: 0.55rem 1rem;
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.8rem; font-weight: 600; color: var(--text);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: border-color 0.3s, background 0.3s;
      cursor: default;
    }
    .status-card:hover { border-color: rgba(45,212,191,0.35); background: rgba(45,212,191,0.06); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.green  { background: #34D399; box-shadow: 0 0 8px #34D399; }
    .status-dot.yellow { background: #FBBF24; box-shadow: 0 0 8px #FBBF24; animation: pulseDot 1.8s ease-in-out infinite; }
    .status-dot.blue   { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .contact-link { font-size: 0.83rem; color: var(--muted); text-align: center; animation: fadeUp 0.9s ease 0.7s both; }
    .contact-link a { color: var(--primary); text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .contact-link a:hover { color: var(--white); }

    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(24px); }  to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 480px) {
      .cd-box { width: 58px; height: 58px; font-size: 1.5rem; border-radius: 10px; }
      .countdown { gap: 0.5rem; }
      .gear-wrap { width: 88px; height: 88px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="blob blob-3" aria-hidden="true"></div>
  <canvas id="canvas-bg" aria-hidden="true"></canvas>

  <main class="page" role="main">

    <!-- Logo -->
    <div class="logo-bar" aria-label="PhiZeeo">
      <div class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 21C12 21 3 14 3 8.5a4.5 4.5 0 0 1 9-0.5 4.5 4.5 0 0 1 9 .5C21 14 12 21 12 21z"/>
        </svg>
      </div>
      <span class="logo-name">PhiZeeo</span>
    </div>

    <!-- Gear animation -->
    <div class="gear-wrap" aria-hidden="true">
      <div class="gear-outer-ring"></div>
      <div class="gear-spin-a">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="
            M50 5 L54 0 L62 0 L66 5
            A45 45 0 0 1 82 18

            A45 45 0 0 1 -4 24
            L-9 19 L-3 13 L2 18

            L22 0 L30 0 L34 5
            A45 45 0 0 1 50 5Z
          " stroke="#2DD4BF" stroke-width="1.4"/>
          <circle cx="50" cy="50" r="22" stroke="#2DD4BF" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
        </svg>
      </div>
      <div class="gear-spin-b">
        <svg viewBox="0 0 60 60" fill="none">
          <path d="
            M30 3 L33 0 L39 0 L42 3
            A27 27 0 0 1 51 12

            A27 27 0 0 1 57 24
            L60 24 L60 36 L57 36
            A27 27 0 0 1 55 44

            A27 27 0 0 1 42 57

            A27 27 0 0 1 30 3Z

      </div>
      <div class="gear-dot"></div>

    <!-- Heading -->
    <h1 class="hero-title">We're <span class="highlight">Upgrading</span> for You</h1>

    <p class="hero-subtitle">
      Our team is working hard behind the scenes to bring you a better experience.<br>
      <em>We Treat. God Heals.</em>
    </p>

    <!-- Countdown -->
    <div class="countdown" id="countdown" role="timer" aria-label="Time until we return">
      <div class="cd-unit">
        <div class="cd-box" id="cd-hours">06</div>
        <span class="cd-label">Hours</span>
      </div>
      <span class="cd-colon" aria-hidden="true">:</span>
      <div class="cd-unit">
        <div class="cd-box" id="cd-mins">00</div>

      </div>
      <span class="cd-colon" aria-hidden="true">:</span>

    <!-- Progress -->
    <div class="progress-section" role="progressbar" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100" aria-label="Maintenance 72% complete">

      <div class="progress-dots">

    <!-- Status cards -->
    <div class="status-row" aria-label="System status">
      <div class="status-card"><div class="status-dot green" aria-hidden="true"></div>Database Backup</div>
      <div class="status-card"><div class="status-dot yellow" aria-hidden="true"></div>Core Upgrade</div>
      <div class="status-card"><div class="status-dot blue" aria-hidden="true"></div>UI Refresh</div>

    <!-- Contact -->
    <p class="contact-link">
      Urgent? Call <a href="tel:+919360447385">+91 93604 47385</a>

      <a href="https://www.instagram.com/phizeeo" target="_blank" rel="noopener">Instagram</a>

  </main>

  <script>
    /* Particles */
    (function () {
      const canvas = document.getElementById('canvas-bg');
      const ctx    = canvas.getContext('2d');
      const COLORS = ['#2DD4BF','#818CF8','#F472B6','#34D399'];
      let W, H, pts = [];

      function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
      resize();
      addEventListener('resize', resize);

      function rand(a,b) { return Math.random()*(b-a)+a; }
      function mkP() { return { x: rand(0,W), y: H+rand(0,40), r: rand(1,2.8), speed: rand(0.3,1.1), op: rand(0.2,0.65), color: COLORS[0|rand(0,4)], dx: rand(-0.4,0.4) }; }

      for (let i=0;i<55;i++) { const p=mkP(); p.y=rand(0,H); pts.push(p); }

      function draw() {
        ctx.clearRect(0,0,W,H);
        pts.forEach((p,i) => {
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle=p.color; ctx.globalAlpha=p.op; ctx.fill();
          p.y-=p.speed; p.x+=p.dx; p.op-=0.0012;
          if(p.y<-10||p.op<=0) pts[i]=mkP();
        });
        ctx.globalAlpha=1;
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* Countdown — 6 hours from page load */
    (function () {
      const END = Date.now() + 6*3600*1000;
      const h = document.getElementById('cd-hours');
      const m = document.getElementById('cd-mins');
      const s = document.getElementById('cd-secs');
      function pad(n){ return String(n).padStart(2,'0'); }
      function tick(){
        const diff = END - Date.now();
        if(diff<=0){ h.textContent=m.textContent=s.textContent='00'; return; }
        h.textContent = pad(Math.floor(diff/3600000));
        m.textContent = pad(Math.floor(diff%3600000/60000));
        s.textContent = pad(Math.floor(diff%60000/1000));
      }
      tick(); setInterval(tick,1000);
    })();
  </script>
